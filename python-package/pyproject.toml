[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "medbr"
version = "0.1.0"
description = "Geospatial visualization of Brazilian public health data"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["folium", "pandas", "geopandas", "numpy", "requests", "branca"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["medbr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
