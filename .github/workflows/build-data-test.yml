name: build-data-test

# Builds the data bundle from the official sources (IBGE, ANS) and optionally
# publishes it as the `data-v1` release that medbr downloads on first use.
on:
  push:
    branches: [feat/build-data-from-sources]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e python-package
      - name: Build data
        env:
          MEDBR_DATA_DIR: ${{ github.workspace }}/data-build
        run: python -m medbr.build_data --bundle medbr-data.zip
      - name: Summary
        run: |
          ls -lh medbr-data.zip
          unzip -l medbr-data.zip
      - uses: actions/upload-artifact@v4
        with:
          name: medbr-data
          path: medbr-data.zip
      - name: End-to-end with the real data
        env:
          MEDBR_DATA_DIR: ${{ github.workspace }}/data-build
        run: |
          python - <<'PY'
          import os, medbr
          from medbr.utils import read_data
          m = read_data("mortality","transformed","mortality.csv"); b = read_data("birth","transformed","birth.csv"); s = read_data("beds","transformed","beds.csv")
          print("SANITY deaths:", int(m.death_count.sum()), "births:", int(b.birth_count.sum()), "beds:", int(s.beds_count.sum()))
          for name, fn in [("beds", lambda: medbr.beds()), ("beds rate SP", lambda: medbr.beds(ufs=["SP"], rate=True)),
                           ("mortality SP month", lambda: medbr.mortality(ufs=["SP"], start_at="2021-03-01", end_at="2021-03-31")),
                           ("birth capital", lambda: medbr.birth(cities_code=[355030], start_at="2022-01-01", end_at="2022-12-31", rate=True))]:
              mp = fn(); mp.save("/tmp/x.html"); print("MAP", name, round(os.path.getsize("/tmp/x.html")/1e6,2), "MB")
          print("DOC", medbr.beds.__doc__.splitlines()[0])
          PY
