name: build-data-test

# Builds the data bundle from the official sources (IBGE, ANS) and optionally
# publishes it as the `data-v1` release that medbr downloads on first use.
on:
  push:
    branches: [feat/build-data-from-sources]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e python-package
      - name: Build data
        env:
          MEDBR_DATA_DIR: ${{ github.workspace }}/data-build
        run: python -m medbr.build_data --bundle medbr-data.zip
      - name: Summary
        run: |
          ls -lh medbr-data.zip
          unzip -l medbr-data.zip
      - uses: actions/upload-artifact@v4
        with:
          name: medbr-data
          path: medbr-data.zip
      - name: End-to-end with the real data
        env:
          MEDBR_DATA_DIR: ${{ github.workspace }}/data-build
        run: |
          python - <<'PY'
          import os, medbr
          from medbr.utils import read_data
          m = read_data("mortality","transformed","mortality.csv"); b = read_data("birth","transformed","birth.csv"); s = read_data("beds","transformed","beds.csv")
          print("SANITY deaths total:", int(m.death_count.sum()), "rows:", len(m), "dates:", m.death_date.min(), m.death_date.max(), "cities:", m.city_code.nunique())
          print("SANITY births total:", int(b.birth_count.sum()), "rows:", len(b), "dates:", b.birth_date.min(), b.birth_date.max(), "cities:", b.city_code.nunique())
          print("SANITY deaths 2021:", int(m[m.death_date.str.startswith("2021")].death_count.sum()), " 2022:", int(m[m.death_date.str.startswith("2022")].death_count.sum()))
          print("SANITY births 2021:", int(b[b.birth_date.str.startswith("2021")].birth_count.sum()), " 2022:", int(b[b.birth_date.str.startswith("2022")].birth_count.sum()))
          print("SANITY beds total:", int(s.beds_count.sum()), s.set_index("uf").beds_count.sort_values().tail(3).to_dict())
          for name, fn in [("beds", lambda: medbr.beds()), ("beds rate", lambda: medbr.beds(rate=True)),
                           ("mortality SP month", lambda: medbr.mortality(ufs=["SP"], start_at="2021-03-01", end_at="2021-03-31")),
                           ("mortality SP month rate", lambda: medbr.mortality(ufs=["SP"], start_at="2021-03-01", end_at="2021-03-31", rate=True)),
                           ("birth capital year", lambda: medbr.birth(cities_code=[355030], start_at="2022-01-01", end_at="2022-12-31"))]:
              mp = fn(); mp.save("/tmp/x.html"); print("MAP", name, round(os.path.getsize("/tmp/x.html")/1e6,1), "MB")
          PY
