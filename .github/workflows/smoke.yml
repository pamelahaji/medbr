name: smoke
on:
  push:
    branches: [test/smoke]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Peek ANS aggregated files
        run: |
          B=https://dadosabertos.ans.gov.br/FTP/PDA
          peekcsv() { echo "== CSV $1"; curl -sL --max-time 120 -r 0-1500 "$1" | head -4 | cut -c1-500; echo "size:"; curl -sIL "$1" | grep -i content-length | tr -d '\r' | tail -1; }
          peekcsv $B/area_comercializacao_planos_ntrp/pda_area_comer_plano_ntrp.csv
          peekcsv $B/caracteristicas_produtos_saude_suplementar-008/pda-008-caracteristicas_produtos_saude_suplementar.csv
          peekcsv $B/caracteristicas_produtos_saude_suplementar-008/pda-008-tabela_auxiliar_de_detalhamento_de_municipios.csv
          echo "== ZIP benef_regiao_geog"; mkdir -p /tmp/p && cd /tmp/p && curl -sL --max-time 200 -o f $B/dados_de_beneficiarios_por_regiao_geografica/benef_regiao_geog.zip; ls -l f | awk '{print "size", $5}'; unzip -l f | tail -5; c=$(unzip -Z1 f | head -1); unzip -p f "$c" | head -4 | cut -c1-500; echo "rows:"; unzip -p f "$c" | wc -l
