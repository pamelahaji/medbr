name: smoke
on:
  push:
    branches: [test/smoke]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check files and columns
        run: |
          S=https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br
          H=https://dadosabertos.saude.gov.br
          echo "== Leitos resources (title | s3)"
          curl -sL --max-time 60 "$H/dataset/hospitais-e-leitos" | grep -o '/dataset/hospitais-e-leitos/resource/[0-9a-f-]*' | sort -u > /tmp/lr.txt
          for p in $(cat /tmp/lr.txt); do
            page=$(curl -sL --max-time 60 "$H$p"); t=$(echo "$page" | grep -o '<title>[^<]*' | head -1 | cut -c8-60); u=$(echo "$page" | grep -o 'https://s3[^"<> ]*' | sort -u | head -1); echo "$t | $u"
          done || true
          mkdir -p /tmp/p && cd /tmp/p
          peekzip() { echo "== ZIP $1"; rm -f f; curl -sL --max-time 300 -o f "$1"; ls -l f | awk '{print "size", $5}'; unzip -l f | tail -4; c=$(unzip -Z1 f | head -1); unzip -p f "$c" | head -2 | cut -c1-600; }
          peekzip $S/SIM/csv/Mortalidade_Geral_2021_csv.zip
          peekzip $S/SINASC/csv/SINASC_2021_csv.zip
          echo "== CSV Leitos_2024"; curl -sL --max-time 300 -o l.csv $S/Leitos_SUS/Leitos_2024.csv; ls -l l.csv | awk '{print "size", $5}'; head -c 700 l.csv | iconv -f latin1 -t utf8 | head -2; 
          python3 - <<'PY'
          import pandas as pd
          d = pd.read_csv("/tmp/p/l.csv", sep=";", encoding="latin-1", nrows=None, low_memory=False)
          print("cols:", list(d.columns)); print("rows:", len(d))
          for c in d.columns:
              if c.upper().startswith("COMP"): print(c, sorted(d[c].astype(str).unique())[:14])
          print(d[["UF","LEITOS_EXISTENTES"]].head(3))
          PY
