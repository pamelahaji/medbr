name: smoke
on:
  push:
    branches: [test/smoke]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official URLs
        run: |
          probe() { echo "== $1"; curl -sIL --max-time 40 "$1" | grep -iE "^HTTP|^content-length|^content-type|^location" | tr -d '\r' | head -8; }
          probe https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SIM/DO21OPEN.csv
          probe https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SIM/DO22OPEN.csv
          probe https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINASC/DN21OPEN.csv
          probe https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINASC/DN22OPEN.csv
          probe https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/Brasil/BR/BR_Municipios_2022.zip
          probe "https://servicodados.ibge.gov.br/api/v3/malhas/paises/BR?intrarregiao=municipio&formato=application/vnd.geo+json&qualidade=minima"
          probe "https://servicodados.ibge.gov.br/api/v3/malhas/paises/BR?intrarregiao=UF&formato=application/vnd.geo+json&qualidade=minima"
          probe https://servicodados.ibge.gov.br/api/v1/localidades/municipios
          echo "== ANS PDA listing"; curl -sL --max-time 40 https://dadosabertos.ans.gov.br/FTP/PDA/ | grep -o 'href="[^"?]*"' | head -40
          echo "== ANS beneficiarios listing"; curl -sL --max-time 40 https://dadosabertos.ans.gov.br/FTP/PDA/informacoes_consolidadas_de_beneficiarios-024/ | grep -o 'href="[^"?]*"' | tail -15
          echo "== opendatasus ckan API"; curl -sL --max-time 40 "https://opendatasus.saude.gov.br/api/3/action/package_search?q=hospitais%20leitos&rows=5" | head -c 1500
