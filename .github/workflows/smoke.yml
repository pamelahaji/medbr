name: smoke
on:
  push:
    branches: [test/smoke]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find and check SIM / SINASC / Leitos files
        run: |
          H=https://dadosabertos.saude.gov.br/dataset
          echo "== SIM resource pages -> s3 urls"
          for r in 37d4deb8-cfba-4187-bef2-74ca1e0be8df 2dee2fc9-d19f-41bc-b058-6d4154f126ab 32fd4a5b-3625-49d8-910f-6752574a989d 9ade641a-1f25-40d9-b55b-cff7096eb5b4 16e78990-4ba6-4e6a-8d60-72e0604cd4b6; do
            echo "-- $r"; curl -sL --max-time 60 "$H/sim/resource/$r" | grep -o 'https://s3[^"<> ]*' | sort -u | head -3
          done
          echo "== Leitos resource links"
          curl -sL --max-time 60 "$H/hospitais-e-leitos" | grep -o '/dataset/hospitais-e-leitos/resource/[0-9a-f-]*' | sort -u | head -40 > /tmp/leitos_res.txt; wc -l /tmp/leitos_res.txt
          for p in $(cat /tmp/leitos_res.txt); do
            page=$(curl -sL --max-time 60 "https://dadosabertos.saude.gov.br$p"); t=$(echo "$page" | grep -o '<title>[^<]*' | head -1 | cut -c1-60); u=$(echo "$page" | grep -o 'https://s3[^"<> ]*' | sort -u | head -1); echo "$t | $u"
          done | grep -E "Leitos (2021|2022|2023|2024)" 
          echo "== HEAD candidates"
          for u in \
            https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINASC/csv/SINASC_2021_csv.zip \
            https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINASC/csv/SINASC_2022_csv.zip \
            https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_2023.csv \
            https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_2024.csv \
            https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_csv_2023.zip ; do
            echo "$(curl -sIL --max-time 30 "$u" | grep -iE '^HTTP|^content-length' | tr -d '\r' | tr '\n' ' ') $u"
          done
