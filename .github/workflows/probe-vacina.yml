name: probe-vacina
on:
  push:
    branches: [feat/covid-vaccine]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          A='imunizacao_public:qlto5t&7r_@+#Tlstigi'
          for ep in desc-imunizacao desc-vacinacao; do
            echo "== $ep count"; curl -s -m 60 -u "$A" -H 'Content-Type: application/json' "https://imunizacao-es.saude.gov.br/$ep/_count" | head -c 400; echo
          done
          echo "== one doc"; curl -s -m 60 -u "$A" -H 'Content-Type: application/json' -d '{"size":1}' "https://imunizacao-es.saude.gov.br/desc-imunizacao/_search" | head -c 2500; echo
          echo "== agg uf"; curl -s -m 120 -u "$A" -H 'Content-Type: application/json' -d '{"size":0,"track_total_hits":true,"aggs":{"uf":{"terms":{"field":"estabelecimento_uf","size":40}}}}' "https://imunizacao-es.saude.gov.br/desc-imunizacao/_search" | head -c 2500; echo
