name: probe-vacina
on:
  push:
    branches: [feat/covid-vaccine]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          B=https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br
          for p in "SIPNI/COVID/uf/" "SIPNI/COVID/completo/" "SIPNI/" "PNI/"; do
            echo "== LIST $p"; curl -s -m 60 "$B/?list-type=2&prefix=$p&delimiter=/&max-keys=60" | python3 -c "
          import sys,re
          x=sys.stdin.read()
          print(re.findall(r'<Key>([^<]+)</Key><LastModified>([^<]+)</LastModified><ETag>[^<]*</ETag><Size>(\d+)</Size>',x)[:40]); print(re.findall(r'<Prefix>([^<]+)</Prefix>',x)[:40]); print(x[:300] if '<Key>' not in x and '<Prefix>' not in x else '')"
          done
