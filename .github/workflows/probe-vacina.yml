name: probe-vacina
on:
  push:
    branches: [feat/covid-vaccine]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import ftplib, io
          f = ftplib.FTP("ftp.datasus.gov.br", timeout=60); f.login(); f.set_pasv(True)
          f.cwd("/dissemin/publicos/PNI/AUXILIARES"); names=f.nlst(); print("AUX", names)
          f.cwd("/dissemin/publicos/PNI/DOCS"); print("DOCS", f.nlst())
          f.cwd("/dissemin/publicos/PNI/AUXILIARES")
          for n in names:
              if "IMUNO" in n.upper() or "IMUN" in n.upper():
                  b=io.BytesIO(); f.retrbinary("RETR "+n,b.write); d=b.getvalue(); print("FILE", n, len(d)); print(d[:3000].decode("latin1"))
          PY
